[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bob-der"
version = "0.9.5"
description = "An autonomous terminal coding agent powered by Ollama"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bob-der" }]
dependencies = ["requests>=2.31", "textual>=0.89"]

[project.scripts]
bob-der = "bob_der.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
